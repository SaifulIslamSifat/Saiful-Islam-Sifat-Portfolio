# Netlify configuration for Saiful Islam Sifat Portfolio

[build]
  # Base directory where package.json and client code lives
  base = "client"
  # Directory where built static files are output
  publish = "dist"
  # Build command
  command = "npm run build"

# Environment variables defaults
[build.environment]
  NODE_VERSION = "20"

# SPA routing: Redirect all requests to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
